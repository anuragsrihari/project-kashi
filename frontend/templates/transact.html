<!DOCTYPE html>
<html>
<head>
    <title>{{ mode|capitalize }} - Kashi Bank</title>
</head>
<body>
    <h1>{{ mode|capitalize }}</h1>

    {% with messages = get_flashed_messages() %}
        {% for m in messages %}
            <p><b>{{ m }}</b></p>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="/{{ mode }}">
        {% if mode == "transfer" %}
            <label>From Account Number:</label><br>
            <input type="text" name="from_account" required><br><br>
            <label>To Account Number:</label><br>
            <input type="text" name="to_account" required><br><br>
        {% else %}
            <label>Account Number:</label><br>
            <input type="text" name="account" required><br><br>
        {% endif %}

        <label>Amount:</label><br>
        <input type="number" name="amount" min="0.01" step="0.01" required><br><br>

        <button type="submit">Submit</button>
    </form>

    <br><a href="/">Back to Home</a>
</body>
</html>
